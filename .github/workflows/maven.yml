name: Java CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OnlineAuctionSystem
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          cache-dependency-path: OnlineAuctionSystem/pom.xml

      - name: Build and Run Tests
        run: mvn -B test -Dcheckstyle.skip=true